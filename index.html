<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Javascript Basics</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="carGame">
    <h1 id="title">Car Game</h1>
    <div id="welcomeContainer">
      <h2>Welcome to the Car Game!</h2>
      <p>Press Enter to start the game</p>
      <p>Use the arrow keys to move the car</p>
    </div>
    <div id="gameContainer" class="hide">
      <div>
        <span id="score"></span>
      </div>
      <div class="road">
        <div id="playerCar" ></div>
      </div>
    </div>
  </div>
</body>
</html>
